name: Build unsigned IPA

on:
  push:
    branches: ["claude/**", "main"]
  pull_request:
  workflow_dispatch:

concurrency:
  # head_ref on pull_request, ref on push: a branch with an open PR then
  # shares one group instead of burning two macOS runners per commit.
  # Both keys resolve to the bare branch name, so the push and pull_request
  # events for one commit share a group instead of running the macOS job twice.
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Cheap checks first: they catch most breakage without burning a macOS runner.
  verify:
    name: Backend tests and project checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neptune-remote
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r raspberry-pi/requirements.txt
          pip install pytest pytest-asyncio

      - name: Backend test suite
        run: python -m pytest -q
        working-directory: neptune-remote/raspberry-pi

      - name: Project, localisation and secret checks
        run: python scripts/verify_project.py

  build:
    name: Unsigned IPA
    needs: verify
    runs-on: macos-14
    defaults:
      run:
        working-directory: neptune-remote
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Regenerate the Xcode project
        run: python3 scripts/generate_xcodeproj.py

      - name: iOS unit tests
        # pipefail matters: without it the pipe through xcpretty swallows
        # xcodebuild's exit status and a failing build reports success.
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/NeptuneRemote.xcodeproj \
            -scheme NeptuneRemote \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Build the unsigned IPA
        run: bash ./scripts/build_unsigned_ipa.sh

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: NeptuneRemote-unsigned-ipa
          path: neptune-remote/dist/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: neptune-remote/dist/*.log
          if-no-files-found: ignore

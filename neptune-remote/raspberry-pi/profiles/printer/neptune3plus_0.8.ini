# name: Elegoo Neptune 3 Plus - 0.8 mm nozzle
# description: Very high flow nozzle - drafts and large functional parts
#
# PrusaSlicer printer profile for an Elegoo Neptune 3 Plus running Klipper.
# Every value here is editable - nothing is hard-coded in the app or backend.

printer_technology = FFF
printer_model = Neptune 3 Plus
printer_variant = 0.8
printer_notes = Elegoo Neptune 3 Plus / Klipper / Moonraker. Generated by neptune-remote.
gcode_flavor = klipper

# ---- build volume ---------------------------------------------------------
bed_shape = 0x0,320x0,320x320,0x320
max_print_height = 400
z_offset = 0

# ---- hotend ---------------------------------------------------------------
nozzle_diameter = 0.8
min_layer_height = 0.06
max_layer_height = 0.6
retract_length = 1
retract_speed = 40
deretract_speed = 30
retract_lift = 0.2
retract_before_travel = 2
retract_before_wear_off = 0
use_relative_e_distances = 1
use_firmware_retraction = 0
single_extruder_multi_material = 0
extruder_offset = 0x0
travel_speed = 200
travel_speed_z = 12

# ---- machine limits (Klipper does the real enforcement) -------------------
machine_limits_usage = time_estimate_only
machine_max_acceleration_x = 3000
machine_max_acceleration_y = 3000
machine_max_acceleration_z = 100
machine_max_acceleration_e = 5000
machine_max_acceleration_extruding = 3000
machine_max_acceleration_retracting = 3000
machine_max_acceleration_travel = 3000
machine_max_feedrate_x = 300
machine_max_feedrate_y = 300
machine_max_feedrate_z = 12
machine_max_feedrate_e = 60
machine_max_jerk_x = 8
machine_max_jerk_y = 8
machine_max_jerk_z = 0.4
machine_max_jerk_e = 2.5
machine_min_extruding_rate = 0
machine_min_travel_rate = 0

# ---- host / thumbnails ----------------------------------------------------
# Mainsail, Fluidd and this app all read the embedded PNG preview.
thumbnails = 300x300
host_type = moonraker
silent_mode = 0
remaining_times = 1

# ---- custom G-code --------------------------------------------------------
# Plain G-code that works on a stock Klipper config. If your printer.cfg
# defines PRINT_START / PRINT_END macros, replace these with:
#   start_gcode = PRINT_START EXTRUDER={first_layer_temperature[0]} BED={first_layer_bed_temperature[0]}
#   end_gcode   = PRINT_END
start_gcode = M190 S{first_layer_bed_temperature[0]}\nM109 S{first_layer_temperature[0]}\nG21\nG90\nM82\nG28\nG92 E0\nG1 Z2.0 F3000\nG1 X5.0 Y20.0 Z0.3 F5000\nG1 X5.0 Y200.0 Z0.3 F1500 E15\nG1 X5.4 Y200.0 Z0.3 F5000\nG1 X5.4 Y20.0 Z0.3 F1500 E30\nG92 E0\nM83
end_gcode = M104 S0\nM140 S0\nM107\nG91\nG1 E-3 F1800\nG1 Z10 F3000\nG90\nG1 X10 Y310 F6000\nM84
before_layer_gcode = ;BEFORE_LAYER_CHANGE\n;[layer_z]
layer_gcode = ;AFTER_LAYER_CHANGE\n;[layer_z]
between_objects_gcode =
toolchange_gcode =
color_change_gcode = M600
pause_print_gcode = PAUSE
template_custom_gcode =
